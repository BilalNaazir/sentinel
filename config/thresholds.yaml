# Regression, drift, verification and alert thresholds. All percentages are percentage points of pass rate.

regression:
  # Noise floor measured 2026-11-13: two identical runs differed by 1 point overall,
  # 5 tickets flipped, and one ticket moves a category by 4-5 points.
  warn_drop_pct: 5.0          # was 3.0: noise alone reached 4 points
  critical_drop_pct: 10.0     # was 8.0
  per_category_critical_drop_pct: 15.0   # was 10.0: one flip = 4-5 points in a category
  min_cases_for_percentages: 20

drift:
  window_runs: 7              # moving average over the last 7 nightly runs
  alert_below_pass_rate: 0.85

pass_criteria:                # a golden case passes when all of these hold
  category_must_match: true
  min_entity_f1: 0.8
  min_summary_score: 4        # judge score, 1-5 scale

verification:
  sample_rate: 0.15           # share of production requests re-run on the reference model
  agreement_threshold: 0.7    # judge agreement below this = routing failure

alerts:
  escalation_rate_spike: 0.25         # alert if more than 25% of requests escalate in an hour
  new_failure_cluster_min_count: 5    # alert if one failure type appears 5+ times in a day

forensics:
  quality_drop_threshold: 2   # first span whose faithfulness score is 2+ points below the previous span = root cause
