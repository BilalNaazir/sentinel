[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "redis",
    "rq",
    "streamlit",
    "httpx",
    "anthropic",
    "openai",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-redis", "types-PyYAML"]

[tool.ruff]
line-length = 110
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]