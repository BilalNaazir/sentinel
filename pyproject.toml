[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "redis",
    "rq",
    "streamlit",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]